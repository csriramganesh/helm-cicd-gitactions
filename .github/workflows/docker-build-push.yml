name: Docker Build and Push

on: 
  push:
    branches:
      - main
          
jobs:
  build-and-push:
    runs-on: ubuntu-latest


    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.multi \
            -t csriramganesh/helm-cicd-gitactions:${{ github.sha }} \
            -t csriramganesh/helm-cicd-gitactions:latest \
            .

      - name: Push Docker image
        run: |
          docker push csriramganesh/helm-cicd-gitactions:${{ github.sha }}
          docker push csriramganesh/helm-cicd-gitactions:latest
            
